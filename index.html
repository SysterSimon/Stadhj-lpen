<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="application-name" content="Städplopp">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Städplopp">
<link rel="manifest" href="./manifest.webmanifest">
<title>Städplopp</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--blue:#2563eb;--green:#10b981;--red:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:12px 12px 90px}.top{position:sticky;top:0;z-index:20;background:#f3f4f6ee;backdrop-filter:blur(8px);padding:8px 0 10px;transition:.2s}.top.hide{transform:translateY(calc(-100% - 8px));opacity:.03}
h1{font-size:1.5rem;margin:0}.sub,.small{color:var(--muted);font-size:.8rem}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.card,.room{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #11182712}.card{padding:11px}.big{font-size:1.3rem;font-weight:900}.bar{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}
.tools{display:flex;gap:7px;flex-wrap:wrap}.btn,.ib{border:1px solid var(--line);background:#fff;border-radius:11px;font-weight:750}.btn{padding:9px 11px}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.danger{background:var(--red);color:#fff;border-color:var(--red)}.rooms{display:grid;gap:11px}.room{overflow:hidden}.rh{display:flex;gap:8px;padding:12px;align-items:flex-start}.rt{font-weight:900;flex:1}.rm{font-size:.78rem;color:var(--muted);margin-top:2px}.bonus{font-size:.75rem;font-weight:900;color:#065f46;background:#d1fae5;padding:5px 8px;border-radius:99px}.ib{width:38px;height:38px}.task{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.ck{width:34px;height:34px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:900}.ck.done{background:var(--green);color:#fff;border-color:var(--green)}.task.done .tn{text-decoration:line-through;color:var(--muted)}.tn{font-weight:800}.tm{font-size:.76rem;color:var(--muted)}.ta{display:flex;gap:5px}.timerline{grid-column:2/4;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.timer{font-weight:900;font-variant-numeric:tabular-nums}.over{color:var(--red)}.chip{font-size:.72rem;background:#eef2ff;color:#3730a3;padding:4px 7px;border-radius:99px}.fab{position:fixed;right:16px;bottom:16px;border:0;border-radius:16px;background:var(--blue);color:#fff;padding:13px 17px;font-weight:900;box-shadow:0 8px 25px #2563eb55}
dialog{border:0;border-radius:17px;padding:0;width:min(92vw,520px);box-shadow:0 24px 70px #0004}dialog::backdrop{background:#11182766}.modal{padding:15px}.modal h2{margin:0 0 10px}.field{display:grid;gap:5px;margin:9px 0}.field input,.field select{padding:10px;border:1px solid #cbd5e1;border-radius:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%) translateY(15px);background:#111827;color:#fff;padding:9px 13px;border-radius:99px;opacity:0;transition:.2s;z-index:90;font-weight:800}.toast.show{opacity:1;transform:translateX(-50%)}#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}.report{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}.stat strong{display:block;font-size:1.18rem}.rr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.good{color:#047857;font-weight:900}.bad{color:#b91c1c;font-weight:900}
@media(max-width:520px){.row{grid-template-columns:1fr}.task{grid-template-columns:auto 1fr}.ta,.timerline{grid-column:2}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="app">
<div class="top" id="top">
<h1>Städplopp</h1><div class="sub">Checka av, slå tiden och få ett tillfredsställande plopp.</div>
<div class="summary"><div class="card"><div class="small">Kvar</div><div class="big" id="left">0 min</div></div><div class="card"><div class="small">Klart</div><div class="big" id="done">0 / 0</div></div></div>
<div class="card"><div style="display:flex;gap:8px;align-items:center"><div style="flex:1"><div class="small">Total tidsfaktor</div><strong id="gp">100%</strong></div><button class="btn" id="minus">−10%</button><button class="btn" id="plus">+10%</button></div><div class="bar"><i id="prog"></i></div><div class="tools"><button class="btn primary" id="install" hidden>Installera app</button><button class="btn" id="sound">Ljud: på</button><button class="btn" id="addRoom">+ Rum</button><button class="btn" id="reset">Nollställ dagen</button></div></div>
</div>
<div class="rooms" id="rooms"></div>
</div>
<button class="fab" id="addTask">+ Moment</button><div class="toast" id="toast"></div>
<dialog id="roomDlg"><form method="dialog" class="modal"><h2 id="roomTitle">Rum</h2><div class="field"><label>Namn</label><input id="roomName" required></div><div class="actions" id="roomActions"><button class="btn" value="cancel">Avbryt</button><button class="btn primary" id="saveRoom" type="button">Spara</button></div></form></dialog>
<dialog id="taskDlg"><form method="dialog" class="modal"><h2 id="taskTitle">Moment</h2><div class="field"><label>Rum</label><select id="taskRoom"></select></div><div class="field"><label>Moment</label><input id="taskName" required></div><div class="row"><div class="field"><label>Minuter</label><input id="mins" type="number" min="1" max="600" value="10"></div><div class="field"><label>Justering %</label><input id="pct" type="number" min="10" max="300" step="5" value="100"></div></div><div class="actions" id="taskActions"><button class="btn" value="cancel">Avbryt</button><button class="btn primary" id="saveTask" type="button">Spara</button></div></form></dialog>
<dialog id="reportDlg"><div class="modal"><h2>Städrapport</h2><div id="report"></div><div class="actions"><button class="btn" id="closeReport">Stäng</button><button class="btn primary" id="copyReport">Kopiera rapport</button></div></div></dialog>
<script>
(()=>{const K='stadplopp-v2',q=s=>document.querySelector(s),ID=()=>Math.random().toString(36).slice(2,9),T=(n,m)=>({id:ID(),name:n,minutes:m,pct:100,done:false,start:null,elapsed:0,alarm:false,warn:false});
const defaults={sound:true,gp:100,celebrated:false,rooms:[
R('Kök',[T('Plocka undan och fria ytor',8),T('Bänkar, spis och ho',10),T('Dammsug',4),T('Våttorka golv',3)]),
R('Hall',[T('Plocka undan',5),T('Dammsug',5),T('Våttorka golv',5)]),
R('Badrum 1',[T('Plocka och torka ytor',6),T('Handfat, toalett och spegel',7),T('Dammsug och våttorka',7)]),
R('Badrum 2',[T('Plocka och torka ytor',6),T('Handfat, toalett och spegel',7),T('Dammsug och våttorka',7)]),
R('Barnrum 1',[T('Plocka i ordning',10),T('Damma',4),T('Dammsug',4),T('Våttorka',2)]),
R('Barnrum 2',[T('Plocka i ordning',10),T('Damma',4),T('Dammsug',4),T('Våttorka',2)]),
R('Sovrum 1',[T('Plocka i ordning',6),T('Damma',3),T('Dammsug',4),T('Våttorka',2)]),
R('Sovrum 2',[T('Plocka i ordning',6),T('Damma',3),T('Dammsug',4),T('Våttorka',2)]),
R('Övriga golv',[T('Dammsug resterande ytor',20),T('Våttorka resterande ytor',20)]),
R('Slutfix',[T('Sopor, bäddning och sista plocket',10)])]};
function R(name,tasks=[]){return{id:ID(),name,tasks,reward:false,start:null,end:null}}
let s;try{s=JSON.parse(localStorage.getItem(K))||structuredClone(defaults)}catch{s=structuredClone(defaults)}
let editR=null,editT=null,tick=null,defer=null;
const save=()=>localStorage.setItem(K,JSON.stringify(s)),adj=t=>Math.max(1,Math.round(t.minutes*t.pct/100*s.gp/100)),elapsed=t=>(t.elapsed||0)+(t.start?Date.now()-t.start:0),rplan=r=>r.tasks.reduce((a,t)=>a+adj(t)*60000,0),re=r=>r.start?((r.end||Date.now())-r.start):0;
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(ms){let z=Math.max(0,Math.floor(ms/1000)),m=Math.floor(z/60),x=z%60;return m+':'+String(x).padStart(2,'0')}
function get(ri,ti){let r=s.rooms.find(x=>x.id===ri);return[r,r&&r.tasks.find(x=>x.id===ti)]}
function startRoom(r){if(!r.start)r.start=Date.now()}
function render(){let all=s.rooms.flatMap(r=>r.tasks),dn=all.filter(t=>t.done).length;q('#left').textContent=all.filter(t=>!t.done).reduce((a,t)=>a+adj(t),0)+' min';q('#done').textContent=dn+' / '+all.length;q('#gp').textContent=s.gp+'%';q('#sound').textContent='Ljud: '+(s.sound?'på':'av');q('#prog').style.width=(all.length?dn/all.length*100:0)+'%';
let out='';for(const r of s.rooms){let plan=r.tasks.reduce((a,t)=>a+adj(t),0),actual=r.end&&r.start?Math.max(1,Math.round((r.end-r.start)/60000)):null;out+=`<section class="room"><div class="rh"><div style="flex:1"><div class="rt">${esc(r.name)}</div><div class="rm">Plan ${plan} min${actual?' · Klar på '+actual+' min':''}</div></div>${r.reward?'<span class="bonus">Tidsbonus</span>':''}<button class="ib er" data-r="${r.id}">⋯</button></div>`;for(const t of r.tasks){let e=elapsed(t),left=adj(t)*60000-e;out+=`<div class="task ${t.done?'done':''}"><button class="ck ${t.done?'done':''}" data-c="${r.id}|${t.id}">${t.done?'✓':''}</button><div><div class="tn">${esc(t.name)}</div><div class="tm">Grundtid ${t.minutes} min · ${t.pct}%</div></div><div class="ta"><button class="ib tim" data-x="${r.id}|${t.id}">${t.start&&!t.done?'Ⅱ':'▶'}</button><button class="ib et" data-x="${r.id}|${t.id}">✎</button></div><div class="timerline"><span class="timer ${left<0&&t.start&&!t.done?'over':''}">${t.start&&!t.done?fmt(Math.abs(left))+(left<0?' över':''):adj(t)+' min'}</span>${t.start&&!t.done?'<span class="chip">timer igång</span>':''}${t.elapsed>0&&!t.done?`<button class="btn rtimer" data-x="${r.id}|${t.id}">Nollställ timer</button>`:''}</div></div>`}out+='</section>'}q('#rooms').innerHTML=out;bind();fillRooms();
if(all.length&&dn===all.length&&!s.celebrated){s.celebrated=true;save();fanfare();confetti(220,3200);toast('Allt klart!');setTimeout(showReport,800)}if(dn<all.length&&s.celebrated){s.celebrated=false;save()}}
function bind(){document.querySelectorAll('.ck').forEach(b=>b.onclick=()=>check(...b.dataset.c.split('|')));document.querySelectorAll('.tim').forEach(b=>b.onclick=()=>timer(...b.dataset.x.split('|')));document.querySelectorAll('.et').forEach(b=>b.onclick=()=>taskDlg(...b.dataset.x.split('|')));document.querySelectorAll('.rtimer').forEach(b=>b.onclick=()=>resetTimer(...b.dataset.x.split('|')));document.querySelectorAll('.er').forEach(b=>b.onclick=()=>roomDlg(b.dataset.r))}
function check(ri,ti){let[r,t]=get(ri,ti);if(!t)return;startRoom(r);if(!t.done){if(t.start){t.elapsed=elapsed(t);t.start=null}t.done=true;plop();toast('Klart: '+t.name);if(r.tasks.length&&r.tasks.every(x=>x.done)){r.end=Date.now();if(re(r)<rplan(r)){r.reward=true;bonus();confetti(60,1000);toast(r.name+': tidsbonus!')}}}else{t.done=false;r.end=null;r.reward=false;click()}save();render()}
function timer(ri,ti){let[r,t]=get(ri,ti);if(!t||t.done)return;startRoom(r);if(t.start){t.elapsed=elapsed(t);t.start=null;pause();toast('Paus: '+t.name)}else{t.start=Date.now();t.alarm=false;t.warn=false;startS();toast('Start: '+t.name)}save();render();ticker()}
function resetTimer(ri,ti){let[,t]=get(ri,ti);t.start=null;t.elapsed=0;t.alarm=t.warn=false;save();resetS();render()}
function ticker(){if(tick)return;tick=setInterval(()=>{let any=false,ch=false;s.rooms.forEach(r=>r.tasks.forEach(t=>{if(t.start&&!t.done){any=true;let left=adj(t)*60000-elapsed(t);if(left<=10000&&left>0&&!t.warn){t.warn=true;ch=true;count();toast('10 sekunder kvar: '+t.name)}if(left<=0&&!t.alarm){t.alarm=true;ch=true;alarm();toast('Tiden är ute: '+t.name)}}}));if(ch)save();render();if(!any){clearInterval(tick);tick=null}},1000)}
function fillRooms(){let e=q('#taskRoom'),v=e.value;e.innerHTML=s.rooms.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');if([...e.options].some(o=>o.value===v))e.value=v}
function roomDlg(id=null){editR=id;let r=s.rooms.find(x=>x.id===id);q('#roomTitle').textContent=r?'Redigera rum':'Lägg till rum';q('#roomName').value=r?.name||'';let old=q('#delRoom');if(old)old.remove();if(r){let b=document.createElement('button');b.id='delRoom';b.type='button';b.className='btn danger';b.textContent='Ta bort rum';b.onclick=()=>{if(confirm('Ta bort '+r.name+' och alla moment?')){s.rooms=s.rooms.filter(x=>x.id!==r.id);save();q('#roomDlg').close();render()}};q('#roomActions').prepend(b)}q('#roomDlg').showModal()}
function taskDlg(ri=null,ti=null){if(!s.rooms.length)return toast('Lägg till ett rum först');editT=ri&&ti?{ri,ti}:null;fillRooms();let t=editT?get(ri,ti)[1]:null;q('#taskTitle').textContent=t?'Redigera moment':'Lägg till moment';q('#taskRoom').value=ri||s.rooms[0].id;q('#taskName').value=t?.name||'';q('#mins').value=t?.minutes||10;q('#pct').value=t?.pct||100;let old=q('#delTask');if(old)old.remove();if(t){let b=document.createElement('button');b.id='delTask';b.type='button';b.className='btn danger';b.textContent='Ta bort moment';b.onclick=()=>{let[r,x]=get(ri,ti);if(confirm('Ta bort '+x.name+'?')){r.tasks=r.tasks.filter(z=>z.id!==ti);save();q('#taskDlg').close();render()}};q('#taskActions').prepend(b)}q('#taskDlg').showModal()}
q('#saveRoom').onclick=()=>{let n=q('#roomName').value.trim();if(!n)return;if(editR)s.rooms.find(r=>r.id===editR).name=n;else s.rooms.push(R(n));save();q('#roomDlg').close();plop();render()}
q('#saveTask').onclick=()=>{let ri=q('#taskRoom').value,n=q('#taskName').value.trim(),m=Math.max(1,+q('#mins').value||1),p=Math.max(10,Math.min(300,+q('#pct').value||100));if(!n)return;if(editT){let[or,t]=get(editT.ri,editT.ti);t.name=n;t.minutes=m;t.pct=p;if(ri!==editT.ri){or.tasks=or.tasks.filter(x=>x.id!==t.id);s.rooms.find(r=>r.id===ri).tasks.push(t)}}else{let t=T(n,m);t.pct=p;s.rooms.find(r=>r.id===ri).tasks.push(t)}save();q('#taskDlg').close();plop();render()}
q('#addRoom').onclick=()=>roomDlg();q('#addTask').onclick=()=>taskDlg();q('#minus').onclick=()=>{s.gp=Math.max(40,s.gp-10);save();click();render()};q('#plus').onclick=()=>{s.gp=Math.min(250,s.gp+10);save();click();render()};q('#sound').onclick=()=>{s.sound=!s.sound;save();render();if(s.sound)plop()};q('#reset').onclick=()=>{if(!confirm('Nollställa avprickningar och timers men behålla rum och tider?'))return;s.rooms.forEach(r=>{r.reward=false;r.start=r.end=null;r.tasks.forEach(t=>{t.done=false;t.start=null;t.elapsed=0;t.alarm=t.warn=false})});s.celebrated=false;save();resetS();render()}
function toast(x){let e=q('#toast');e.textContent=x;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1700)}
function ac(){if(!s.sound)return null;try{return window._ac=window._ac||new(AudioContext||webkitAudioContext)()}catch{return null}}function tone(f,d=.08,type='sine',g=.07,delay=0){let a=ac();if(!a)return,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,a.currentTime+delay);v.gain.exponentialRampToValueAtTime(g,a.currentTime+delay+.005);v.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+d);o.connect(v).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d+.02)}
const plop=()=>{tone(240,.06,'sine',.12);tone(520,.08,'sine',.08,.045)},click=()=>tone(800,.025,'square',.03),startS=()=>{tone(330,.06);tone(494,.08,'triangle',.08,.06);tone(659,.1,'triangle',.07,.12)},pause=()=>{tone(520,.07,'triangle');tone(390,.09,'sine',.06,.07)},resetS=()=>{tone(260,.05,'square',.04);tone(220,.06,'square',.03,.05)},count=()=>[0,.18,.36].forEach((d,i)=>tone(900+i*80,.045,'square',.045,d)),alarm=()=>[0,.17,.34,.58,.75,.92].forEach((d,i)=>tone(i<3?980:740,.11,'square',.075,d)),bonus=()=>{tone(523,.1,'triangle');tone(659,.1,'triangle',.08,.09);tone(784,.18,'triangle',.08,.18)},fanfare=()=>{[523,659,784,1046,784,988,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.08,i*.11))}
function confetti(n=120,d=2200){let c=q('#confetti'),x=c.getContext('2d'),D=devicePixelRatio||1;c.width=innerWidth*D;c.height=innerHeight*D;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.scale(D,D);let a=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-30-Math.random()*200,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,r:3+Math.random()*5,h:Math.random()*360})),st=performance.now();(function f(now){x.clearRect(0,0,innerWidth,innerHeight);a.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;x.fillStyle='hsl('+p.h+' 85% 55%)';x.fillRect(p.x,p.y,p.r*2,p.r)});if(now-st<d)requestAnimationFrame(f)})(st)}
function reportData(){let rs=s.rooms.filter(r=>r.tasks.length&&r.tasks.every(t=>t.done)),pm=rs.reduce((a,r)=>a+rplan(r),0),am=rs.reduce((a,r)=>a+re(r),0),df=pm-am,total=s.rooms.reduce((a,r)=>a+r.tasks.length,0),bon=rs.filter(r=>r.reward).length,rows=rs.map(r=>{let p=rplan(r),a=re(r),d=p-a;return`<div class="rr"><div><strong>${esc(r.name)}</strong><div class="small">Plan ${Math.round(p/60000)} min · Faktisk ${Math.round(a/60000)} min</div></div><div class="${d>=0?'good':'bad'}">${d>=0?'-':'+'}${Math.abs(Math.round(d/60000))} min</div></div>`}).join('');return{html:`<div class="report"><div class="stat"><span class="small">Planerad tid</span><strong>${Math.round(pm/60000)} min</strong></div><div class="stat"><span class="small">Faktisk tid</span><strong>${Math.round(am/60000)} min</strong></div><div class="stat"><span class="small">Moment</span><strong>${total}</strong></div><div class="stat"><span class="small">Tidsbonus rum</span><strong>${bon}</strong></div></div><p class="${df>=0?'good':'bad'}">${df>=0?Math.round(df/60000)+' min snabbare än plan':Math.abs(Math.round(df/60000))+' min över plan'}</p>${rows}`,text:'Städrapport\nPlanerad tid: '+Math.round(pm/60000)+' min\nFaktisk tid: '+Math.round(am/60000)+' min\n'+(df>=0?Math.round(df/60000)+' min snabbare än plan':Math.abs(Math.round(df/60000))+' min över plan')}}
function showReport(){q('#report').innerHTML=reportData().html;q('#reportDlg').showModal()}q('#closeReport').onclick=()=>q('#reportDlg').close();q('#copyReport').onclick=async()=>{try{await navigator.clipboard.writeText(reportData().text);plop();toast('Rapport kopierad')}catch{toast('Kunde inte kopiera')}}
let ly=scrollY;addEventListener('scroll',()=>{let y=scrollY,d=y-ly,e=q('#top');if(y<40)e.classList.remove('hide');else if(d>8)e.classList.add('hide');else if(d<-8)e.classList.remove('hide');ly=y},{passive:true});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();defer=e;q('#install').hidden=false});q('#install').onclick=async()=>{if(!defer)return toast('Välj Installera app i webbläsarens meny');defer.prompt();try{await defer.userChoice}catch{}defer=null;q('#install').hidden=true};addEventListener('appinstalled',()=>{q('#install').hidden=true;toast('Städplopp är installerad')});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
ticker();render()})();
</script>
</body></html>
